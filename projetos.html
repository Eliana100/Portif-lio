<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="40x40"
      href="./img/Sparkling.svg"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Detalhes do Projeto</title>
  </head>
  <body class="pagina-detalhes">
    <!-- Seção cabeçalho -->
    <header>
      <div class="logo">
        <a href="index.html"><img src="./img/Sparkling.svg" alt="Logo" /></a>
      </div>

      <nav class="navbar">
        <ul class="links-nav">
          <li class="links-menu"><a href="index.html">Início</a></li>
          <li class="links-menu">
            <a href="index.html">Voltar aos Projetos</a>
          </li>
          <li class="menu-curriculo-mobile">
            <a
              href="./PDF/Software Engineering Student  - curriculo.pdf"
              download="Curriculo-Eliana-Silva.pdf"
            >
              Baixar Currículo
            </a>
          </li>
        </ul>
      </nav>

      <a
        href="./PDF/Software Engineering Student  - curriculo.pdf"
        download="Curriculo-Eliana-Silva.pdf"
        id="button-curriculo"
      >
        Currículo <img src="./img/Download.svg" alt="Baixar" />
      </a>

      <button class="menu-hamburguer" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <main class="container-detalhes">
      <!-- Banner destaque (hero) -->
      <section class="destaque-projeto">
        <div class="container-banner" id="projeto-banner">
          <!-- Imagem injetada pelo JS -->
        </div>
        <button
          class="seta-galeria prev"
          aria-label="Imagem anterior"
          onclick="scrollGaleria(-1)"
        >
          &#10094;
        </button>
        <button
          class="seta-galeria next"
          aria-label="Próxima imagem"
          onclick="scrollGaleria(1)"
        >
          &#10095;
        </button>
      </section>

      <!-- Miniaturas da galeria -->
      <section class="galeria-projeto">
        <div class="container-miniaturas" id="projeto-galeria">
          <!-- Thumbs injetadas pelo JS -->
        </div>
      </section>

      <!-- Informações do projeto -->
      <section class="informacoes-projeto">
        <div class="sobre-projeto">
          <h2 class="titulos" id="titulo-pagina">Sobre</h2>
          <div class="texto">
            <p id="projeto-descricao"><!-- Texto injetado --></p>
          </div>
        </div>

        <div class="cartao-links-projeto cartao-formacao">
          <p class="tag">Acesso completo</p>
          <ul id="lista-links">
            <!-- Links injetados -->
          </ul>
        </div>
      </section>
    </main>

    <!-- Rodapé -->
    <footer class="footer">
      <p>© Eliana Silva 2026. Todos os Direitos Reservados.</p>
    </footer>

    <script src="script-detalhes.js"></script>

    <!-- VLibras - Acessibilidade em Libras -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>
  </body>
</html>
